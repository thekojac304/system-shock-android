apply plugin: 'com.android.application'

def releaseStoreFilePath = System.getenv('RP5NP_RELEASE_STORE_FILE')
def releaseStorePasswordValue = System.getenv('RP5NP_RELEASE_STORE_PASSWORD')
def releaseKeyAliasValue = System.getenv('RP5NP_RELEASE_KEY_ALIAS')
def releaseKeyPasswordValue = System.getenv('RP5NP_RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = [
    releaseStoreFilePath,
    releaseStorePasswordValue,
    releaseKeyAliasValue,
    releaseKeyPasswordValue
].every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace "com.rp5np.systemshock"
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    ndkVersion "29.0.14206865"

    defaultConfig {
        buildConfigField 'boolean', 'AUDIO_DIAGNOSTICS', 'false'
        // Stable v1 starts a clean Android application identity so it can coexist
        // with the historical pre-release package com.rp5np.systemshock.
        applicationId "io.github.thekojac304.systemshock"
        minSdkVersion 33
        targetSdkVersion 33
        versionCode 10101
        versionName "1.1.0-beta.2"

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
            }
        }
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePasswordValue
                keyAlias releaseKeyAliasValue
                keyPassword releaseKeyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }

        qa {
            initWith debug
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa"
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
            // TEMPORARY AUDLIFE, opt in with -Prp5npAudioDiagnostics=true.
            def audioDiagnostics = project.findProperty('rp5npAudioDiagnostics') == 'true'
            buildConfigField 'boolean', 'AUDIO_DIAGNOSTICS', audioDiagnostics.toString()
            externalNativeBuild {
                cmake {
                    arguments "-DRP5NP_AUDIO_DIAGNOSTICS=${audioDiagnostics ? 'ON' : 'OFF'}"
                    arguments "-DRP5NP_QA_TOOLS=ON"
                }
            }
        }

        release {
            debuggable false
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }

        releaseQa {
            initWith release
            applicationIdSuffix ".releaseqa"
            versionNameSuffix "-releaseqa"
            debuggable false
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version "3.22.1"
        }
    }

    lint {
        abortOnError false
    }
    buildFeatures { buildConfig true }
}

dependencies {
}
